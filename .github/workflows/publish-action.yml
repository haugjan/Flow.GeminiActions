name: Publish Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/*
      - .gitignore
      - LICENSE
      - README.md
      - CLAUDE.md
      - dist/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release version
        id: latest
        uses: reloc8/action-latest-release-version@1.0.0

      - name: Read version from plugin.json
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: Flow.GeminiActions/plugin.json
          prop_path: Version

      - name: Decide if release is required
        id: gate
        shell: pwsh
        run: |
          $updated = '${{ steps.version.outputs.prop }}'
          $latest = '${{ steps.latest.outputs.latest-release }}'
          if ([string]::IsNullOrWhiteSpace($latest)) { $latest = '' }
          $latest = $latest -replace '^v',''
          $required = ($updated -ne $latest)
          "required=$required" >> $env:GITHUB_OUTPUT
          "updated=$updated"   >> $env:GITHUB_OUTPUT
          "latest=$latest"     >> $env:GITHUB_OUTPUT
          Write-Host "Updated: $updated  Latest: $latest  Required: $required"

      - name: Setup .NET
        if: steps.gate.outputs.required == 'True'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        if: steps.gate.outputs.required == 'True'
        run: dotnet test Flow.GeminiActions.slnx -c Release --logger "console;verbosity=normal"

      - name: Build (publish)
        if: steps.gate.outputs.required == 'True'
        run: |
          $out = "out/GeminiActions-${{ steps.version.outputs.prop }}"
          dotnet publish "Flow.GeminiActions/Flow.GeminiActions.csproj" -c Release -r win-x64 --no-self-contained -o "$out"
          powershell -NoProfile -Command "Compress-Archive -Path $out\* -DestinationPath 'GeminiActions-${{ steps.version.outputs.prop }}.zip' -Force"

      - name: Publish GitHub Release
        if: steps.gate.outputs.required == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.prop }}
          name: v${{ steps.version.outputs.prop }}
          files: GeminiActions-${{ steps.version.outputs.prop }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
